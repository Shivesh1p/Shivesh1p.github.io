<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shivesh Kumar Pandey — Portfolio</title>
  <meta name="description" content="Shivesh Kumar Pandey — Full Stack Developer and AI Engineer (Java, Spring Boot, React, FastAPI, LLMs, RAG). Full Stack Developer Intern at Traction Shastra."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Shivesh Kumar Pandey — Full Stack &amp; AI Engineer"/>
  <meta property="og:description" content="Java Spring Boot, React, FastAPI, LLMs and RAG. Full Stack Developer Intern at Traction Shastra. 200+ LeetCode problems solved."/>
  <meta name="theme-color" content="#0a0a0f"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0f'/%3E%3Ctext x='50' y='66' font-size='44' font-family='monospace' font-weight='700' fill='%2300e5ff' text-anchor='middle'%3ESKP%3C/text%3E%3C/svg%3E"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --border: #2a2a3a;
      --accent: #00e5ff;
      --accent2: #ff6b35;
      --accent3: #7b61ff;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      overflow-x: hidden;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      background: rgba(10,10,15,0.7);
    }
    .nav-logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a.nav-resume {
      color: var(--accent);
      border: 1px solid rgba(0,229,255,0.4);
      padding: 0.4rem 0.9rem;
      border-radius: 2px;
    }
    .nav-links a.nav-resume:hover { background: rgba(0,229,255,0.1); }
    .btn-resume { border-color: rgba(0,229,255,0.4); color: var(--accent); }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8rem 4rem 4rem;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 70% 40%, rgba(0,229,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(123,97,255,0.05) 0%, transparent 60%);
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .hero-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 4rem;
      align-items: center;
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-status {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text);
      letter-spacing: 0.08em;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }
    .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #50fa7b;
      box-shadow: 0 0 0 0 rgba(80,250,123,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(80,250,123,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(80,250,123,0); }
      100% { box-shadow: 0 0 0 0 rgba(80,250,123,0); }
    }
    .hero-roles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.55s forwards;
    }
    .hero-roles span {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.6;
      padding: 0.45rem 1rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      background: var(--card);
    }
    .hero-roles span.hl {
      color: #000;
      font-weight: 600;
      border-color: transparent;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
    }
    .hero-meta {
      display: flex;
      gap: 2.2rem;
      flex-wrap: wrap;
      margin-top: 3rem;
      padding-top: 1.6rem;
      border-top: 1px solid var(--border);
      opacity: 0;
      animation: fadeUp 0.9s 1s forwards;
    }
    .hero-meta b { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .hero-meta small {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hero-card {
      background: rgba(22,22,31,0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,229,255,0.07);
      opacity: 0;
      animation: fadeUp 1s 0.8s forwards;
    }
    .hero-card-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .hero-card-bar i { width: 9px; height: 9px; border-radius: 50%; background: #3a3a4a; display: block; }
    .hero-card-bar i:nth-child(1) { background: #ff5f56; }
    .hero-card-bar i:nth-child(2) { background: #ffbd2e; }
    .hero-card-bar i:nth-child(3) { background: #27c93f; }
    .hero-card-bar span { margin-left: 0.8rem; font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); }
    .hero-card pre {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      line-height: 1.9;
      padding: 1.4rem 1.5rem;
      color: var(--text);
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .c-k { color: #ff6b35; }
    .c-t { color: var(--accent); }
    .c-s { color: #50fa7b; }
    .c-c { color: var(--muted); }
    .hero-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }
    .hero-name {
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.4s forwards;
    }
    .hero-name span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.25);
    }
    .hero-desc {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 580px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.7s forwards;
    }
    .hero-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.9s 0.85s forwards;
    }
    .btn {
      padding: 0.85rem 2rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover { background: #fff; transform: translateY(-2px); }
    .btn-ghost { border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    /* Sections */
    section { padding: 7rem 4rem; position: relative; }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 3.5rem;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }
    .about-text {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      line-height: 2;
      color: var(--muted);
    }
    .about-text strong { color: var(--text); }
    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.8rem;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s;
    }
    .stat-card:hover { border-color: rgba(0,229,255,0.2); transform: translateY(-4px); }
    .stat-card:hover::before { transform: scaleX(1); }
    .stat-num {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Experience */
    .exp-section { background: var(--surface); }
    .exp-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 4px;
      max-width: 820px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
    }
    .exp-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent3));
    }
    .exp-card:hover { border-color: rgba(0,229,255,0.15); transform: translateY(-4px); }
    .exp-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .exp-role { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; }
    .exp-company { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent2); }
    .exp-date {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      background: rgba(0,229,255,0.06);
      border: 1px solid rgba(0,229,255,0.15);
      padding: 0.35rem 0.9rem;
      border-radius: 2px;
      letter-spacing: 0.1em;
    }
    .exp-list {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.9;
      padding-left: 1.2rem;
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
    }
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .project-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(.23,1,.32,1);
    }
    .project-card:hover { border-color: rgba(0,229,255,0.15); transform: translateY(-6px); }
    .project-card:hover::after { transform: scaleX(1); }
    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .project-num {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.2em;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      border: 1px solid rgba(0,229,255,0.3);
      color: var(--accent);
      background: rgba(0,229,255,0.06);
    }
    .badge.live { border-color: rgba(80,250,123,0.35); color: #50fa7b; background: rgba(80,250,123,0.07); }
    .project-name {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }
    .project-desc {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }
    .project-tech { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
    .tech-pill {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: rgba(123,97,255,0.1);
      border: 1px solid rgba(123,97,255,0.25);
      color: #a594ff;
    }
    .project-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }
    .project-links a {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .project-links a:hover { color: var(--accent); border-color: var(--accent); }

    /* Skills */
    .skills-section { background: var(--surface); }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .skill-group {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 4px;
      transition: border-color 0.3s, transform 0.3s;
    }
    .skill-group:hover { border-color: rgba(0,229,255,0.15); transform: translateY(-3px); }
    .skill-group-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .skill-group-title::before {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--accent2);
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.35rem 0.8rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      transition: all 0.2s;
    }
    .tag:hover { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.3); color: var(--accent); }

    /* Education */
    .edu-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3rem;
      border-radius: 4px;
      max-width: 760px;
      position: relative;
      overflow: hidden;
    }
    .edu-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent3));
    }
    .edu-degree { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .edu-uni { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent2); margin-bottom: 0.5rem; }
    .edu-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 1.5rem; }
    .edu-gpa {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(0,229,255,0.06);
      border: 1px solid rgba(0,229,255,0.15);
      padding: 0.7rem 1.4rem;
      border-radius: 2px;
      margin-bottom: 2rem;
    }
    .edu-gpa-num { font-size: 1.8rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .edu-gpa-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .cert-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 0.8rem;
    }
    .cert-list {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.9;
      padding-left: 1.2rem;
    }

    /* Contact */
    .contact-section { background: var(--surface); }
    .contact-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }
    .contact-info {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 2;
    }
    .contact-links { display: flex; flex-direction: column; gap: 1rem; }
    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      transition: all 0.25s;
      word-break: break-all;
    }
    .contact-link:hover { border-color: var(--accent); color: var(--accent); transform: translateX(6px); }
    .contact-link-icon {
      min-width: 36px; height: 36px;
      background: rgba(255,255,255,0.04);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    /* Footer */
    footer {
      padding: 2rem 4rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer p { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s, transform 0.7s; }
    .reveal.visible { opacity: 1; transform: none; }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      section { padding: 4rem 1.5rem; }
      .hero { padding: 6rem 1.5rem
